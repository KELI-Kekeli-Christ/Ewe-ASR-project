# ################################
# Model: AfriHuBERT + DNN + CTC
# Augmentation: SpeedPerturb + DropFreq + DropChunk
# Adapté de fine_tune_afrihubert_fon_asr.yaml (fongbe) pour l'ewe
# ################################

seed: 1337
__set_seed: !apply:speechbrain.utils.seed_everything [!ref <seed>]
debug: False
device: cuda
exp_name: AfriHuBERT_CTC_Ewe_mina_v4
output_folder: /home/data/projets-aps/projet6/fine_tuning_afrihubert_ewe/results/<exp_name>
output_wer_folder: !ref <output_folder>/
test_wer_file: !ref <output_folder>/wer_test.txt
save_folder: !ref <output_folder>/save
train_log: !ref <output_folder>/train_log.txt

# Manifests produits par prepare_ewe_manifests.py
root_data_folder: /home/data/projets-aps/projet6/data/data_ewe
data_folder: !ref <root_data_folder>/wav_export_mina_v3

accented_letters: True
language: ewe
csv_dir: /home/data/projets-aps/projet6/data/data_ewe/csvs_afrihubert_mina_v3
train_csv: !ref <csv_dir>/train.csv
valid_csv: !ref <csv_dir>/valid.csv
test_csv:
   - !ref <csv_dir>/test.csv

####################### Training Parameters ####################################
number_of_epochs: 60
lr: 1
lr_hubert: 0.0001
precision: fp32
sample_rate: 16000
sorting: ascending
ckpt_interval_minutes: 30
num_workers: 2

# Doit tenir dans le budget VRAM du GPU alloué (cf. .sh, contrainte 24-32GB).
# Identique au recipe fongbe de référence (batch=4/GPU).
batch_size: 2
test_batch_size: 2

train_dataloader_opts:
   batch_size: !ref <batch_size>
   num_workers: !ref <num_workers>

valid_dataloader_opts:
   batch_size: !ref <batch_size>

test_dataloader_opts:
   batch_size: !ref <test_batch_size>

# BPE parameters
token_type: char  # ["unigram", "bpe", "char"]
character_coverage: 1.0
#######################

hubert_hub: ajesujoba/AfriHuBERT
hubert_folder: !ref <save_folder>/hubert

# IMPORTANT : contrairement au recipe fongbe (qui charge un checkpoint BEST-RQ
# continué-pré-entraîné localement via pt_model_path + pretrainer), on part
# ici DIRECTEMENT des poids AfriHuBERT publiés sur le Hub (hubert_hub
# ci-dessus, chargés automatiquement par le lobe HuBERT de SpeechBrain).
# pt_model_path reste optionnel : laisse "" (chaîne vide, PAS null -- hyperpyyaml
# plante sur `!ref <pt_model_path>/hubert.ckpt` si null, cf. concaténation
# None + str) pour fine-tuner directement depuis le Hub, ou passe
# --pt_model_path /chemin/vers/CKPT+... si tu as toi-même fait un
# pré-entraînement continué (BEST-RQ) sur de l'audio ewe non-annoté au
# préalable (cf. train_with_bestrq.py dans le recipe fongbe).
pt_model_path: ""

# hubert specific parameters
hubert_frozen: False
features_dim: 768

####################### Model Parameters #######################################
wav2vec_output_dim: 1024
dnn_neurons: 1024
freeze_wav2vec: False

# Outputs
# ATTENTION : la valeur ci-dessous est un DEFAULT PROVISOIRE. Lance d'abord
# prepare_ewe_manifests.py, qui affiche le nombre réel de caractères uniques
# du corpus train (attendu : lettres IPA ewe ɖ/ƒ/ɣ/ŋ/ɔ/ɛ + diacritiques
# tonals + latin standard -> probablement 60-100). Ajuste cette valeur en
# conséquence AVANT de lancer l'entraînement (un vocab_size trop petit fait
# fusionner/UNK-iser silencieusement les caractères les moins fréquents,
# ce qui est particulièrement grave ici car ça peut avaler les diacritiques
# tonals -- input direct pour ton travail sur le TER).
output_neurons: 110

# Decoding parameters
blank_index: 0
bos_index: 1
eos_index: 2

tokenizer: !new:sentencepiece.SentencePieceProcessor

epoch_counter: !new:speechbrain.utils.epoch_loop.EpochCounter
    limit: !ref <number_of_epochs>

############################## Augmentations ###################################

speed_perturb: !new:speechbrain.augment.time_domain.SpeedPerturb
    orig_freq: !ref <sample_rate>
    speeds: [95, 100, 105]

drop_freq: !new:speechbrain.augment.time_domain.DropFreq
    drop_freq_low: 0
    drop_freq_high: 1
    drop_freq_count_low: 1
    drop_freq_count_high: 3
    drop_freq_width: 0.05

drop_chunk: !new:speechbrain.augment.time_domain.DropChunk
    drop_length_low: 1000
    drop_length_high: 2000
    drop_count_low: 1
    drop_count_high: 5

enc: !new:speechbrain.nnet.containers.Sequential
    input_shape: [null, null, !ref <features_dim>]
    linear1: !name:speechbrain.nnet.linear.Linear
        n_neurons: !ref <dnn_neurons>
        bias: True
    bn1: !name:speechbrain.nnet.normalization.BatchNorm1d
    activation: !new:torch.nn.LeakyReLU
    drop: !new:torch.nn.Dropout
        p: 0.15
    linear2: !name:speechbrain.nnet.linear.Linear
        n_neurons: !ref <dnn_neurons>
        bias: True
    bn2: !name:speechbrain.nnet.normalization.BatchNorm1d
    activation2: !new:torch.nn.LeakyReLU
    drop2: !new:torch.nn.Dropout
        p: 0.15
    linear3: !name:speechbrain.nnet.linear.Linear
        n_neurons: !ref <dnn_neurons>
        bias: True
    bn3: !name:speechbrain.nnet.normalization.BatchNorm1d
    activation3: !new:torch.nn.LeakyReLU

hubert: !new:speechbrain.lobes.models.huggingface_transformers.hubert.HuBERT
    source: !ref <hubert_hub>
    output_norm: True
    freeze: !ref <hubert_frozen>
    save_path: !ref <hubert_folder>

ctc_lin: !new:speechbrain.nnet.linear.Linear
    input_size: !ref <dnn_neurons>
    n_neurons: !ref <output_neurons>

log_softmax: !new:speechbrain.nnet.activations.Softmax
    apply_log: True

ctc_cost: !name:speechbrain.nnet.losses.ctc_loss
    blank_index: !ref <blank_index>

modules:
    hubert: !ref <hubert>
    enc: !ref <enc>
    ctc_lin: !ref <ctc_lin>

model: !new:torch.nn.ModuleList
    - [!ref <enc>, !ref <ctc_lin>]

model_opt_class: !name:torch.optim.Adadelta
    lr: !ref <lr>
    rho: 0.95
    eps: 1.e-8

hubert_opt_class: !name:torch.optim.Adam
    lr: !ref <lr_hubert>

warmup: 8000
hold: 32000
cooldown: 40000
optimizer_step_limit: 1200000

lr_annealing_model: !new:speechbrain.nnet.schedulers.NewBobScheduler
    initial_value: !ref <lr>
    improvement_threshold: 0.0025
    annealing_factor: 0.5
    patient: 2

lr_annealing_hubert: !new:speechbrain.nnet.schedulers.NewBobScheduler
    initial_value: !ref <lr_hubert>
    improvement_threshold: 0.0025
    annealing_factor: 0.8
    patient: 2

checkpointer: !new:speechbrain.utils.checkpoints.Checkpointer
    checkpoints_dir: !ref <save_folder>
    recoverables:
        hubert: !ref <hubert>
        model: !ref <model>
        scheduler_model: !ref <lr_annealing_model>
        scheduler_hubert: !ref <lr_annealing_hubert>
        counter: !ref <epoch_counter>

# pretrainer reste défini (le .py vérifie `pt_model_path is not None` avant
# de l'utiliser), donc inoffensif si pt_model_path reste null.
pretrainer: !new:speechbrain.utils.parameter_transfer.Pretrainer
   collect_in: !ref <save_folder>
   loadables:
      hubert: !ref <hubert>
   paths:
      hubert: !ref <pt_model_path>/hubert.ckpt

train_logger: !new:speechbrain.utils.train_logger.FileTrainLogger
    save_file: !ref <train_log>

error_rate_computer: !name:speechbrain.utils.metric_stats.ErrorRateStats

cer_computer: !name:speechbrain.utils.metric_stats.ErrorRateStats
    split_tokens: True
